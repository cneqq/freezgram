name: Personal release APK

on:
  push:
    branches:
      - no-plugins
  workflow_dispatch:
    inputs:
      architecture:
        description: APK variant
        type: choice
        default: arm64-v8a
        options:
          - both
          - arm64-v8a
          - x86_64
          - universal

permissions:
  contents: read

concurrency:
  group: personal-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'cneqq/freezgram'
    name: Release APK (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            github.event_name == 'workflow_dispatch' && inputs.architecture == 'both'
            && '[{"abi":"arm64-v8a","label":"arm64"},{"abi":"x86_64","label":"x86_64"},{"abi":"universal","label":"universal"}]'
            || github.event_name == 'workflow_dispatch' && inputs.architecture == 'x86_64'
            && '[{"abi":"x86_64","label":"x86_64"}]'
          || github.event_name == 'workflow_dispatch' && inputs.architecture == 'universal'
            && '[{"abi":"universal","label":"universal"}]'
            || '[{"abi":"arm64-v8a","label":"arm64"}]'
          ) }}
    env:
      NATIVE_TARGET: ${{ matrix.abi }}
      APK_ABI_LABEL: ${{ matrix.label }}
      PERSONAL_BUILD_ID: personal
      PERSONAL_APPLICATION_ID: com.freezgram.app
      PERSONAL_BUILD_LABEL: Freezgram
      OPTIMIZATION_MODE: release
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - name: Check Telegram and signing Secrets before downloading sources
        shell: bash
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          python3 - <<'PYCODE'
          import os
          import re
          api_id = os.environ.get('API_ID', '')
          api_hash = os.environ.get('API_HASH', '')
          if not re.fullmatch(r'[1-9][0-9]{0,9}', api_id) or int(api_id) > 2147483647:
              raise SystemExit('Missing or invalid API_ID. Add it at Settings > Secrets and variables > Actions in cneqq/freezgram.')
          if not re.fullmatch(r'[0-9a-fA-F]{32}', api_hash):
              raise SystemExit('Missing or invalid API_HASH. Add it at Settings > Secrets and variables > Actions in cneqq/freezgram.')
          for name in ('RELEASE_KEYSTORE', 'KEYSTORE_PASS'):
              if not os.environ.get(name):
                  raise SystemExit('Missing signing Secret: ' + name + '. See docs/PERSONAL_BUILD.md. Temporary signing is disabled.')
          print('Telegram and signing Secrets are present; their values are hidden.')
          PYCODE

      - name: Checkout with pinned submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 1

      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Python 3.11 for CI verification scripts
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install native and Android tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends --yes ccache nasm ninja-build
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' 'build-tools;36.0.0' \
            'ndk;27.2.12479018' 'cmake;3.31.6'
          echo "CMAKE=${ANDROID_HOME}/cmake/3.31.6/bin/cmake" >> "$GITHUB_ENV"
          ccache --max-size=2G

      - name: Determine native inputs and runner memory
        id: build_settings
        shell: bash
        run: |
          python3 - <<'PYSETTINGS'
          import hashlib
          import os
          import subprocess
          from pathlib import Path
          digest = hashlib.sha256(b'native-v4-no-plugins-ndk27.2.12479018-cmake3.31.6')
          digest.update(os.environ['NATIVE_TARGET'].encode('utf-8'))
          # CMake caches contain absolute paths: repository renames require a new entry.
          digest.update(os.environ['GITHUB_WORKSPACE'].encode('utf-8'))
          for path in ('TMessagesProj/jni',):
              digest.update(subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path]).strip())
          for path in ('TMessagesProj/build.gradle', 'build.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties'):
              digest.update(Path(path).read_bytes())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('native_key=' + digest.hexdigest() + '\n')
          memory_kib = int(next(line.split()[1] for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemTotal:')))
          memory_gib = memory_kib // 1024 // 1024
          heap = max(2, min(6, memory_gib - 4))
          workers = max(1, min(4, os.cpu_count() or 2))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'BUILD_HEAP_GIB={heap}\nBUILD_WORKERS={workers}\n')
          attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
          # Keep this workflow path and formula shared by main and no-plugins.
          # GITHUB_RUN_NUMBER is the workflow counter across branches.
          version_code = 1_000_000 + 1000 * int(os.environ['GITHUB_RUN_NUMBER']) + attempt
          if not 0 < attempt < 1000 or not 0 < version_code <= 2_100_000_000:
              raise SystemExit('Version code is out of range.')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'PERSONAL_VERSION_CODE={version_code}\n')
          print(f'Runner memory: {memory_gib} GiB; Gradle heap: {heap} GiB; workers: {workers}')
          PYSETTINGS

      - name: Restore downloaded dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: dependencies-linux-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: dependencies-linux-

      - name: Restore native compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: native-${{ matrix.abi }}-ndk27-${{ github.sha }}
          restore-keys: native-${{ matrix.abi }}-ndk27-

      - name: Restore exact native build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: native-outputs-linux-${{ steps.build_settings.outputs.native_key }}

      - name: Configure build
        shell: bash
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path
          def property_value(value):
              encoded = value.encode('utf-16-be')
              return ''.join('\\u' + encoded[i:i+2].hex() for i in range(0, len(encoded), 2))
          props = {'sdk.dir': os.environ['ANDROID_HOME']}
          api_id = os.environ.get('API_ID', '')
          api_hash = os.environ.get('API_HASH', '')
          if not re.fullmatch(r'[1-9][0-9]{0,9}', api_id) or int(api_id) > 2147483647:
              raise SystemExit('Set API_ID in this repository Actions Secrets.')
          if not re.fullmatch(r'[0-9a-fA-F]{32}', api_hash):
              raise SystemExit('Set API_HASH in this repository Actions Secrets.')
          props.update(TELEGRAM_APP_ID=api_id, TELEGRAM_APP_HASH=api_hash)
          for key in ('RELEASE_KEYSTORE', 'KEYSTORE_PASS'):
              if not os.environ.get(key):
                  raise SystemExit('Missing personal signing Secret: ' + key)
          key_file = Path('TMessagesProj/release.keystore')
          key_file.touch(mode=0o600)
          key_file.write_bytes(base64.b64decode(os.environ['RELEASE_KEYSTORE'], validate=True))
          props.update(KEYSTORE_PASS=os.environ['KEYSTORE_PASS'],
                       ALIAS_NAME=os.environ.get('ALIAS_NAME') or 'personal',
                       ALIAS_PASS=os.environ.get('ALIAS_PASS') or os.environ['KEYSTORE_PASS'])
          import subprocess
          subprocess.run(['keytool', '-list', '-keystore', str(key_file),
                          '-storepass:env', 'KEYSTORE_PASS', '-alias', props['ALIAS_NAME']],
                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)
          path = Path('local.properties')
          path.touch(mode=0o600)
          path.write_text(''.join(f'{k}={property_value(v)}\n' for k, v in props.items()))
          PY

      - name: Build ${{ matrix.abi }} release APK
        shell: bash
        env:
          COMMIT_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          export BUILD_TIMESTAMP=$(date +%s)
          ./gradlew --no-daemon --console=plain --max-workers="$BUILD_WORKERS" \
            "-Dorg.gradle.jvmargs=-Xmx${BUILD_HEAP_GIB}g -XX:+UseG1GC -XX:MaxHeapFreeRatio=40 -Dfile.encoding=UTF-8" \
            :TMessagesProj:assembleRelease

      - name: Verify APK contents, manifest and signature
        shell: bash
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import zipfile
          apks = list(Path('TMessagesProj/build/outputs/apk/release').glob('*.apk'))
          if len(apks) != 1:
              raise SystemExit('Expected exactly one release APK for ' + os.environ['NATIVE_TARGET'])
          abi = os.environ['NATIVE_TARGET']
          apk = Path(f'artifact/freezgram-{os.environ["OPTIMIZATION_MODE"]}-{os.environ["APK_ABI_LABEL"]}.apk')
          shutil.copyfile(apks[0], apk)
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0'
          manifest = subprocess.check_output([str(tools / 'aapt2'), 'dump', 'badging', str(apk)], text=True)
          configurations = subprocess.check_output([str(tools / 'aapt2'), 'dump', 'configurations', str(apk)], text=True).splitlines()
          for locale in ('ru-rRU', 'uk-rUA'):
              if not any(config.strip() == locale or config.strip().startswith(locale + '-') for config in configurations):
                  raise SystemExit('Bundled UI translations were stripped: ' + locale)
          expected_package = 'com.freezgram.app'
          if f"package: name='{expected_package}'" not in manifest:
              raise SystemExit('APK does not use the stable personal package.')
          if os.environ['PERSONAL_BUILD_LABEL'] not in manifest:
              raise SystemExit('APK launcher label does not identify the personal app.')
          if f"versionCode='{os.environ['PERSONAL_VERSION_CODE']}'" not in manifest:
              raise SystemExit('APK version code does not match this run.')
          if 'android.permission.REQUEST_INSTALL_PACKAGES' in manifest:
              raise SystemExit('APK installation permission must not be present.')
          if 'application-debuggable' in manifest:
              raise SystemExit('Release APK must not be debuggable.')
          expected_abis = {'arm64-v8a', 'x86_64'} if abi == 'universal' else {abi}
          if any(expected not in manifest for expected in expected_abis):
              raise SystemExit('APK is missing an expected ABI: ' + repr(expected_abis))
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              for expected in expected_abis:
                  if f'lib/{expected}/libtmessages.49.so' not in names:
                      raise SystemExit('Native Telegram/wallet library is missing for ' + expected)
              packaged_abis = {name.split('/')[1] for name in names if name.startswith('lib/') and name.endswith('.so')}
              if packaged_abis != expected_abis:
                  raise SystemExit('Unexpected native ABI set: ' + repr(packaged_abis))
              forbidden_paths = ('chaquopy', 'libpython', 'libaliuhook', 'liblsplant')
              if any(any(token in name.lower() for token in forbidden_paths) for name in z.namelist()):
                  raise SystemExit('APK contains a removed plugin runtime.')
              forbidden_classes = (b'Lapp/exteraless/plugins/', b'Lcom/chaquo/python/',
                                   b'Lde/robv/android/xposed/', b'Lorg/mvel2/', b'Lcom/android/dx/')
              for name in z.namelist():
                  if name.startswith('classes') and name.endswith('.dex'):
                      dex = z.read(name)
                      if any(token in dex for token in forbidden_classes):
                          raise SystemExit('APK contains removed plugin runtime classes: ' + name)
          certificate = subprocess.check_output(['keytool', '-exportcert', '-keystore', 'TMessagesProj/release.keystore',
                                                 '-storepass:env', 'KEYSTORE_PASS', '-alias', os.environ.get('ALIAS_NAME') or 'personal'])
          signer_sha256 = hashlib.sha256(certificate).hexdigest()
          signature = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--verbose', '--print-certs', str(apk)], text=True)
          if f'Signer #1 certificate SHA-256 digest: {signer_sha256}' not in signature:
              raise SystemExit('APK was not signed with the configured personal key.')
          print(signature)

          checksum = hashlib.sha256(apk.read_bytes()).hexdigest()
          Path('artifact/SHA256SUMS.txt').write_text(f'{checksum}  {apk.name}\n')
          Path('artifact/build-info.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'build_type': 'release', 'abi': abi,
              'optimization': os.environ['OPTIMIZATION_MODE'], 'minified': True,
              'application_id': expected_package, 'app_label': os.environ['PERSONAL_BUILD_LABEL'],
              'firebase': False,
              'api_source': 'personal', 'version_code': int(os.environ['PERSONAL_VERSION_CODE']),
              'signer_sha256': signer_sha256, 'personal_signing': True, 'sha256': checksum}, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f'Optimization: {os.environ["OPTIMIZATION_MODE"]} (release signing, not debuggable)\n\n')
              f.write(f'Stable personal app: `{expected_package}` — {os.environ["PERSONAL_BUILD_LABEL"]}\n\n')
              f.write('Future versions with the same signing key update this app and preserve its data. Old isolated packages remain separate. Firebase is disabled; background notifications need device verification.\n\n')
              f.write('Telegram API source: API_ID/API_HASH Secrets. A persistent personal signing key is required.\n\n')
              f.write('The app updater, APK installation and plugin engine are removed. GramWallet remains. Login, transfers and wallet key security were not tested.\n')
          PY
          ccache --show-stats

      - name: Upload APK only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freezgram-${{ matrix.label }}-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Remove build credentials and temporary keys
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f local.properties TMessagesProj/release.keystore "$HOME/.android/debug.keystore"

  publish-release:
    if: github.repository == 'cneqq/freezgram' && github.event_name == 'workflow_dispatch' && inputs.architecture == 'both'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all three APK variants
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: freezgram-*-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts

      - name: Verify release contents and create checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find release-artifacts -type f -name '*.apk' | sort)
          if [[ "${#apks[@]}" -ne 3 ]]; then
            echo "Expected ARM64, x86_64 and universal APKs; found ${#apks[@]}" >&2
            exit 1
          fi
          for variant in arm64 x86_64 universal; do
            if [[ "$(find release-artifacts -type f -name "*-${variant}.apk" | wc -l)" -ne 1 ]]; then
              echo "Missing or duplicate ${variant} APK" >&2
              exit 1
            fi
          done
          sha256sum "${apks[@]}" > release-artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "personal-${RUN_NUMBER}" \
            release-artifacts/*/*.apk release-artifacts/SHA256SUMS.txt \
            --title "Freezgram build #${RUN_NUMBER}" \
            --notes "Personal release build from no-plugins. Includes ARM64, x86_64 and universal APKs."
