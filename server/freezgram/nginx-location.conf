location = /freezgram/api/badges {
    limit_except GET { deny all; }
    alias /etc/freezgram-api/badges.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=60";
    access_log off;
}

location = /freezgram/api/activity {
    limit_except POST { deny all; }
    limit_req zone=freezgram_activity_ip burst=10 nodelay;
    limit_req zone=freezgram_activity_total burst=10 nodelay;
    limit_req_status 429;
    limit_conn freezgram_activity_connections 8;
    limit_conn_status 429;
    client_max_body_size 128;
    client_body_timeout 5s;
    proxy_request_buffering on;
    proxy_connect_timeout 2s;
    proxy_read_timeout 6s;
    access_log off;
    proxy_pass http://127.0.0.1:8091/activity;
}

location ^~ /freezgram/api/ {
    access_log off;
    return 404;
}
